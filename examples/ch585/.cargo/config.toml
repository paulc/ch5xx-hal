[build]
target = "riscv32imac-unknown-none-elf"

[target.riscv32imac-unknown-none-elf]
# `probe-rs run` flashes, resets, and streams defmt over RTT in one step.
# Swap back to `wlink flash` if you only want to program the part.
# runner = "wlink flash"
runner = "probe-rs run --chip CH585"
# No `-C target-feature=+xwchc` (WCH's extra compressed opcodes, ~2-3% smaller
# code): rustc does not know the feature and warns that passing it will become
# a hard error (rust-lang/rust#162235).

[unstable]
build-std = ["core"]

[env]
DEFMT_LOG = "info"
