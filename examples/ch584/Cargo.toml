[package]
name = "ch584-examples"
version = "0.1.0"
edition = "2021"

[dependencies]
ch5xx-hal = { path = "../../", features = ["ch584", "rt", "memory-x", "embassy", "exti", "highcode"] }

panic-halt = "1.0"
embedded-hal = "1.0.0"
embedded-io-async = "0.7.0"
nb = "1.1.0"

embassy-executor = { version = "0.10.0", features = ["executor-thread"] }
embassy-futures = "0.1.2"
embassy-time = "0.5.1"

qingke = "0.8.2"
qingke-rt = "0.8.2"

[features]
default = ["platform-spin"]
## The embassy executor busy-polls (never sleeps).
platform-spin = ["embassy-executor/platform-spin"]
## The embassy executor sleeps in WFI between polls. Build with
## `--no-default-features --features platform-riscv32`.
platform-riscv32 = ["embassy-executor/platform-riscv32"]

[profile.release]
strip = false   # symbols are not flashed to the microcontroller, so don't strip them.
debug = 2
lto = true
opt-level = "s"

[profile.dev]
overflow-checks = false

# Must match the HAL's `[patch]`: build against the local qingke checkout until
# the release with the per-core features is on crates.io.
[patch.crates-io]
qingke = { path = "../../../qingke" }
qingke-rt = { path = "../../../qingke/qingke-rt" }
