[package]
name = "ch5xx-hal"
version = "0.1.0"
edition = "2021"
authors = ["Andelf <andelf@gmail.com>"]
repository = "https://github.com/ch32-rs/ch5xx-hal"
documentation = "https://docs.rs/ch5xx-hal"
categories = ["embedded", "no-std", "hardware-support"]
description = "HAL for the WCH CH5xx (BLE) RISC-V microcontrollers"
keywords = ["ch5xx", "risc-v", "hal"]
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]
# Local build of ch5xx-data; publish-time this becomes a crates.io version.
ch5xx-metapac = { path = "../ch5xx-data/build/ch5xx-metapac", features = ["rt"] }

# `unsafe-trust-wch-atomics`: qingke refuses to build for a target with atomics
# (riscv32imac) unless this is set. On CH592 (QingKe V4C) the AMOs hold, but an
# LR/SC loop (compare_exchange) loses updates when an interrupt writes the same
# word between the LR and the SC. Build applications for riscv32imc, where
# atomic read-modify-writes take a critical section instead (portable-atomic
# here; embassy's own fallback). CH584/CH585 (QingKe V3C) have no A extension
# at all (misa 0x40901106): an AMO traps as an illegal instruction, so they
# must be built for riscv32imc.
qingke = { version = "0.8.3", features = ["critical-section-impl", "unsafe-trust-wch-atomics"] }
qingke-rt = { version = "0.8.3", optional = true }
# Atomic read-modify-writes on riscv32imc, by critical section (native on
# riscv32imac).
portable-atomic = { version = "1.11", default-features = false, features = ["critical-section"] }

embedded-hal = "1.0"
embedded-hal-async = "1.0.0"
embedded-hal-nb = "1.0.0"
embedded-io = "0.7.1"
embedded-io-async = "0.7.0"
nb = "1.1.0"

embassy-sync = "0.8.0"
embassy-time-driver = { version = "0.2.2", optional = true }
embassy-time-queue-utils = { version = "0.3.2", optional = true }
embassy-executor = { version = "0.10.0", optional = true }

embassy-hal-internal = "0.5.0"
# USB device driver (CH592, CH584/CH585).
embassy-usb-driver = { version = "0.2.2", optional = true }

critical-section = "1.2.0"

[build-dependencies.proc-macro2]
version = "1.0"

[build-dependencies.quote]
version = "1.0"

[build-dependencies]
ch5xx-metapac = { path = "../ch5xx-data/build/ch5xx-metapac", default-features = false, features = [
    "metadata",
] }

[features]
default = ["rt"]
rt = ["dep:qingke-rt"]
## embassy-time driver on the core SysTick.
embassy = ["rt", "dep:embassy-time-driver", "dep:embassy-time-queue-utils"]
## A thread-mode embassy executor that sleeps when idle
## (`embassy::Executor`). Replaces embassy-executor's `platform-*`
## executors.
executor = ["embassy", "dep:embassy-executor"]
## Built-in GPIO_A/GPIO_B interrupt handlers for `exti::ExtiInput`.
## Disable to provide your own.
exti = ["rt"]
## Run interrupt entry, the vector table and `.highcode` functions from RAM
## (`qingke-rt`'s `highcode`), as ch32-hal does. Code runs several times
## faster from RAM than from flash; `soft_i2c` needs it for 100 kHz.
highcode = ["rt", "qingke-rt?/highcode"]

# Part-selection features, one per part number as in ch32-hal. Exactly one
# must be enabled. A part selects its die in `ch5xx-metapac` and its QingKe
# core (CH584/CH585 are V3C, CH592 is V4C); the package decides which pins
# get singletons (see build.rs).
## CH584M, QFN48.
ch584m = ["ch5xx-metapac/ch584", "_v3c"]
## CH584X, QFN48, 512 KB flash.
ch584x = ["ch5xx-metapac/ch584x", "_v3c"]
## CH584F, QFN32.
ch584f = ["ch5xx-metapac/ch584", "_v3c"]
## CH585M, QFN48.
ch585m = ["ch5xx-metapac/ch585", "_v3c"]
## CH585F, QFN32.
ch585f = ["ch5xx-metapac/ch585", "_v3c"]
## CH585C, QFN26.
ch585c = ["ch5xx-metapac/ch585", "_v3c"]
## CH585D, QFN20.
ch585d = ["ch5xx-metapac/ch585", "_v3c"]
## CH592X, QFN32.
ch592x = ["ch5xx-metapac/ch592", "_v4c"]
## CH592F, QFN28.
ch592f = ["ch5xx-metapac/ch592", "_v4c"]
## CH592A, QFN28 (2.3 V minimum supply, no page erase).
ch592a = ["ch5xx-metapac/ch592", "_v4c"]
## CH592D, QFN20.
ch592d = ["ch5xx-metapac/ch592", "_v4c"]

# The QingKe cores, selected by the part features.
_v3c = ["qingke-rt?/v3c", "qingke/v3c", "dep:embassy-usb-driver"]
_v4c = ["qingke-rt?/v4c", "qingke/v4c", "dep:embassy-usb-driver"]

## BLE: WCH's BLE library (vendored in `vendor/wch-ble`), TMOS driven
## from embassy, GAP/GATT bindings and helpers. Binaries add `-Tble.x`
## after `-Tlink.x`. The library's time-critical code runs from RAM.
ble = ["highcode"]
## Emit `memory.x` from the metapac's memory layout, so `qingke-rt`'s `link.x`
## can find it. Enable in the binary crate, not the HAL (see ch32-hal).
memory-x = ["ch5xx-metapac/memory-x"]
